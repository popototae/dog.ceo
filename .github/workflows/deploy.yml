name: Frontend CI/CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker image
        run: |
          docker build \
            -t $IMAGE_NAME:latest \
            -t $IMAGE_NAME:${{ github.sha }} \
            .
          docker push $IMAGE_NAME:latest
          docker push $IMAGE_NAME:${{ github.sha }}

  deploy:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script_stop: true
          script: |
            set -e
            echo "👤 User ปัจจุบันบน VPS: $(whoami)"
            echo "📂 Home Directory: $HOME"

            # ตรวจสอบสิทธิ์การใช้งาน Docker (ต้องใช้ sudo หรือไม่)
            if docker info >/dev/null 2>&1; then
                DOCKER_BIN="docker"
            elif sudo docker info >/dev/null 2>&1; then
                DOCKER_BIN="sudo docker"
            else
                echo "❌ ไม่พบ Docker หรือ Docker daemon ไม่ได้เปิดอยู่บนเครื่อง VPS"
                exit 1
            fi
            echo "🐳 ใช้คำสั่ง Docker: $DOCKER_BIN"

            # ใช้โฟลเดอร์ $HOME/app เพื่อป้องกันปัญหา Permission Denied ของ /opt
            APP_DIR="$HOME/app"
            mkdir -p "$APP_DIR"
            cd "$APP_DIR"

            # สร้างหรืออัปเดต docker-compose.yml
            cat << 'EOF' > docker-compose.yml
            services:
              dog-app:
                image: ghcr.io/popototae/dog.ceo:latest
                container_name: simple-dog-vue-app
                ports:
                  - "8088:80"
                restart: unless-stopped
            EOF

            echo "📥 กำลัง Pull image ล่าสุด..."
            $DOCKER_BIN compose pull || $DOCKER_BIN-compose pull

            echo "🚀 กำลัง Start container..."
            $DOCKER_BIN compose up -d --remove-orphans || $DOCKER_BIN-compose up -d --remove-orphans

            echo "🧹 กำลังลบ Image เก่า..."
            $DOCKER_BIN image prune -f

            echo "=== ✅ ผลลัพธ์ Container บน VPS ==="
            $DOCKER_BIN ps -f name=simple-dog-vue-app